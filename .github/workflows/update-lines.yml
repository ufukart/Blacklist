name: Update Line Count

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Count lines
        run: |
          FILE="blacklist.txt"

          LINES=$(wc -l < "$FILE")

          mkdir -p .badges

          cat > .badges/lines.json <<EOF
          {
            "schemaVersion": 1,
            "label": "IPs",
            "message": "$LINES",
            "color": "blue"
          }
          EOF

      - name: Commit changes
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git add .badges/lines.json README.md

          git diff --cached --quiet || (
            git commit -m "Update line count"
            git push
          )
            - name: Update README
            COUNT=$(grep '"message"' .badges/lines.json | sed -E 's/.*"message": "([^"]+)".*/\1/')

            sed -i -E \
              "s#(<!--IP_COUNT-->).*?(<!--/IP_COUNT-->)#\1${COUNT}\2#" \
              README.md